services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: celtto_totems
      POSTGRES_USER: celtto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-esta-clave}
    volumes:
      - celtto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celtto -d celtto_totems"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [celtto]
    # 5432 no expuesto al host por defecto (hardening)

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [celtto]
    profiles: ["scale"]

  app:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Argentina/Cordoba}
      DB_CLIENT: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: celtto_totems
      POSTGRES_USER: celtto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-esta-clave}
      POSTGRES_SSL: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      LOG_HTTP: ${LOG_HTTP:-true}
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
    networks: [celtto]

networks:
  celtto:
    driver: bridge

volumes:
  celtto_pgdata:
